[binaries]
c = 'aarch64-linux-gnu-gcc'
cpp = 'aarch64-linux-gnu-g++'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkgconfig = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'armv8.2-a'
endian = 'little'

[properties]
# Turnip/DXVK/FEX любят lld: быстрее линковка и лучше ICF
c_args = ['-march=armv8.2-a+crypto+fp16', '-mtune=cortex-a75', '-O3', '-fomit-frame-pointer']
cpp_args = ['-march=armv8.2-a+crypto+fp16', '-mtune=cortex-a75', '-O3', '-fomit-frame-pointer', '-fno-plt']
c_link_args = ['-Wl,--icf=all', '-Wl,-O2', '-fuse-ld=lld']
cpp_link_args = ['-Wl,--icf=all', '-Wl,-O2', '-fuse-ld=lld']
needs_exe_wrapper = true
