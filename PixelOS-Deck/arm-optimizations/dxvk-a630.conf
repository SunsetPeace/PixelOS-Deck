# DXVK профиль для Turnip/a630 (gen7). Совпадает по смыслу с ограничениями,
# которые DroidDeck описывает в docs/development/game-environment.md для Adreno 6xx.
[general]
numThreads = 2                 # big cluster: компиляция шейдеров не душит рендер-тред
logLevel = 1
memoryReported = false

[device]
allowExtGraphicsPipelineLibrary = false   # gen7 не поддерживает pipeline library
enableExtension = dxvk-extension-DXVK_memory_budget

[hud]
enabled = false

[perf]
spinSyncDrain = false          # на 8 ядер KGSL-троттлинг заметнее экономии
zeroInitWorkgroupMemory = true # иначе garbage на compute-passes в turnip
