# SPDX-License-Identifier: GPL-3.0-only
# ============================================================================
# configs/blueline.conf — единственный источник правды для Google Pixel 3
# (blueline) / Pixel 3 XL (sargo). Все скрипты и рецепты читают ТОЛЬКО этот
# файл; нигде в коде не должно быть «магических» адресов и размеров.
#
# Адреса разделов взяты из AOSP device/google/crosshatch (BoardConfig,
# fstab.qcom) и проверяются на устройстве командой `fastboot getvar all`
# перед прошивкой (см. scripts/prepare-device.sh dump-partitions).
# При смене baseline перепроверьте размеры обязательно.
# ============================================================================

PRODUCT_DEVICE="blueline"
PRODUCT_NAME="Pixel 3"
PRODUCT_BOARD="crosshatch"
CHIPSET="msm8998"                     # Snapdragon 845
GPU="Adreno A630"
GPU_ARCH="a630"                       # Mesa turnip: gen7 (a6xx)
GPU_DRIVER="turnip"                   # freedreno a6xx Vulkan driver
CPU_ARCH="armv8.2-a+crc+fp16+asimd"   # Kryo 385 Gold/Silver
# Последняя официальная прошивка именно для Pixel 3 (blueline) —
# SP1A.210812.016.C2, Android 12, июнь 2022. SQ1A.220205.002 (Android 12L)
# публиковалась только для Pixel 4/4XL/4a и новее — НЕ путать модели!
ANDROID_BASELINE="SP1A.210812.016.C2"
KERNEL_TARGET="android15-6.6 GKI + qcom DTBO overlay"

# --------------------------------------------------------------------------
# Память и ядра
# --------------------------------------------------------------------------
RAM_BYTES=2147483648                  # 2 GiB LPDDR4x
CPU_CLUSTERS=2
CPU_LITTLE_CORES="0-3"                # Kryo 385 Silver
CPU_BIG_CORES="4-7"                   # Kryo 385 Gold
CPU_MAX_FREQ_KHZ_LITTLE=1771200
CPU_MAX_FREQ_KHZ_BIG=2457600
GPU_MAX_FREQ_HZ=710000000             # A630 boost step
GPU_STEPS=16

# --------------------------------------------------------------------------
# Экран
# --------------------------------------------------------------------------
DISPLAY_WIDTH=1080
DISPLAY_HEIGHT=2160
DISPLAY_REFRESH_HZ=60
TOUCH_INPUT_NAME="synaptics_tcm_touch"   # для gamepad->touch mapping

# --------------------------------------------------------------------------
# Целевые разделы под Linux-runtime (erofs rootfs, A/B)
# system_a/system_b переиспользуются как steamdeck_a/steamdeck_b.
# --------------------------------------------------------------------------
PART_BOOT_SIZE=$((48*1024*1024))
PART_DTBO_SIZE=$((8*1024*1024))
PART_VENDOR_KEEP=1                    # vendor остаётся из factory-образа
PART_DECK_A_SIZE=$((3*1024*1024*1024))     # targetfs slot A (erofs, ro)
PART_DECK_B_SIZE=$((3*1024*1024*1024))     # targetfs slot B
PART_HOME_MIN=$((40*1024*1024*1024))       # userdata остаётся f2fs ext-shared
PART_STATE_SIZE=$((32*1024*1024))         # persistent state overlay

DECK_PARTITION_A="system_a"
DECK_PARTITION_B="system_b"

# --------------------------------------------------------------------------
# Файловые образы / URL (sha256 заполняет prepare-device.sh, см. checksums/)
# --------------------------------------------------------------------------
FACTORY_URL_PREFIX="https://dl.google.com/dl/android/aosp/blueline-"
ARCH_ARM_ROOTFS_URL="https://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz"
GKI_KERNEL_REPO="https://android.googlesource.com/kernel/manifest"
GKI_KERNEL_BRANCH="android15-6.6"
VALVE_PIPewire_URL="https://repo.steampowered.com/steam/pool/steam/main/s/"

# --------------------------------------------------------------------------
# Верификация / файловые системы
# --------------------------------------------------------------------------
AVB_ALGORITHM="sha256,rsa4096"
DMVERITY_HASH_BLOCK=4096
EROSFS_CLUSTER=4096
EROSFS_COMPRESS="lz4hc,12"
HOME_FS="f2fs"
STATE_FS="ext4"

# --------------------------------------------------------------------------
# Thermal guard (overlay/usr/local/bin/deck-thermal-guard) — пороги в милли-
# градусах Цельсия (формат thermal_zone*/temp). Пороги взяты из stock
# thermal-engine конфигураций crosshatch (CPU shutdown ~105 °C, battery
# protection 60 °C) и усечены до комфортного лимита корпуса (~45 °C skin).
# --preset performance поднимает ceiling на THERMAL_HYSTERESIS_M и сдвигает
# все пороги на +THERMAL_PERF_OFFSET_M; critical не двигается (безопасность).
# --------------------------------------------------------------------------
THERMAL_POLL_MS=2000                  # период опроса датчиков
THERMAL_HYSTERESIS_M=3000             # гистерезис ступеней, 3.0 °C
THERMAL_STEP_DOWN_PCT=10              # насколько резать ceiling за ступень
THERMAL_MIN_BIG_PCT=40                # пол: big cluster не ниже 40% от max
THERMAL_MIN_GPU_PCT=30                # пол: GPU не ниже 30% от max
THERMAL_WARN_CPU_M=78000              # stage 1: cpu-cluster* / qcom-tsens
THERMAL_HOT_CPU_M=88000               # stage 2
THERMAL_CRIT_CPU_M=95000              # stage 3: emergency, всегда активен
THERMAL_WARN_GPU_M=75000              # a630_pwr / gpu-датчики
THERMAL_HOT_GPU_M=85000
THERMAL_WARN_BATT_M=44000             # battery: comfort (skin ~45 °C)
THERMAL_HOT_BATT_M=48000
THERMAL_CRIT_BATT_M=55000             # stock battery protection
THERMAL_QUIET_M=55000                 # ниже этого — полный сброс ступеней (stage->0)
THERMAL_REARM_MARGIN_M=6000           # гистерезис возврата: спуск на одну ступень,
                                      # пока датчики не остыли ниже warn/hot/quiet REARM-полосы
THERMAL_PERF_OFFSET_M=3000            # performance: сдвиг warn/hot на +3 °C

# --------------------------------------------------------------------------
# Runtime-пути внутри targetfs. Совпадают с layout DroidDeck, чтобы recipes
# и staged-библиотеки переиспользовались без переписывания.
# --------------------------------------------------------------------------
DD_RUNTIME_DIR="/opt/droiddeck"
DD_GAMES_DIR="/home/deck/Games"
DD_PROTON_DIR="${DD_RUNTIME_DIR}/proton"
DD_FEX_DIR="${DD_RUNTIME_DIR}/fex"
SESSION_USER="deck"
SESSION_UID=10100
SESSION_GID=10100
